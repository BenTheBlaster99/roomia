<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Roomia</title>
    <style>
      /* 16 Nov redesign: the brand's deep blue, the wordmark in white with its gold full stop, a gold bar. No web fonts here
         (the splash shows before the server): a heavy system face, widened to echo Archivo's extra-wide wordmark. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(120% 90% at 50% 0%, #124c5e 0%, #0c3644 55%, #08242e 100%);
        color: #f4f1ea;
        font: 15px/1.5 'Segoe UI', system-ui, sans-serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
      }
      h1 {
        margin: 0;
        font: 900 40px/1 'Arial Black', 'Segoe UI Black', 'Segoe UI', system-ui, sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transform: scaleX(1.18);
      }
      h1 span {
        color: #d6aa67;
      }
      #text {
        min-height: 1.5em;
        color: rgba(244, 241, 234, 0.7);
      }
      .bar {
        width: 300px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 30%;
        border-radius: 3px;
        background: linear-gradient(90deg, #d6aa67, #c0904d);
        animation: slide 1.4s ease-in-out infinite;
      }
      .fill.known {
        animation: none;
        transition: width 0.25s;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(340%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Roomia<span>.</span></h1>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div id="text">Démarrage…</div>
    </main>
    <script>
      const text = document.getElementById('text')
      const fill = document.getElementById('fill')
      window.roomiaDesktop?.onStatus(s => {
        text.textContent = s.text
        if (s.fraction === null) {
          fill.classList.remove('known')
          fill.style.width = '30%'
        } else {
          fill.classList.add('known')
          fill.style.width = Math.round(s.fraction * 100) + '%'
        }
      })
    </script>
  </body>
</html>
